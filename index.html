<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateSync - AI Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 TranslateSync</h1>
            <p>Free AI Translation with Multiple Providers</p>
        </header>

        <div class="settings-panel">
            <div class="setting-group">
                <label>📡 Provider:</label>
                <select id="provider">
                    <option value="groq">⚡ Groq (Fastest - Free)</option>
                    <option value="openai">🤖 OpenAI</option>
                    <option value="cohere">✨ Cohere</option>
                    <option value="huggingface">🤗 HuggingFace</option>
                </select>
                <small>Get free keys: groq.com, cohere.com, huggingface.co</small>
            </div>

            <div class="setting-group">
                <label>🔑 API Key:</label>
                <input type="password" id="apiKey" placeholder="Paste your API key here">
            </div>

            <div class="setting-group">
                <label>🌍 Target Language:</label>
                <select id="language">
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Chinese (Simplified)">Chinese (Simplified)</option>
                    <option value="Traditional Chinese (Hong Kong)">Traditional Chinese (Hong Kong)</option>
                    <option value="Korean">Korean</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Russian">Russian</option>
                    <option value="Arabic">Arabic</option>
                </select>
            </div>

            <div class="setting-group">
                <label>⚙️ Mode:</label>
                <select id="mode">
                    <option value="direct">Direct Translation</option>
                    <option value="reference">With Reference Style</option>
                </select>
            </div>
        </div>

        <div id="status" class="status"></div>

        <div class="main-content">
            <div id="referenceSection" class="section hidden">
                <h3>📚 Reference Style (Optional)</h3>
                <div class="io-pair">
                    <div class="io-box">
                        <label>Original Text:</label>
                        <textarea id="refOriginal" placeholder="Example: Hello world"></textarea>
                    </div>
                    <div class="io-box">
                        <label>Your Translation:</label>
                        <textarea id="refTranslation" placeholder="Example: Hola mundo"></textarea>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>📝 Text to Translate</h3>
                <textarea id="sourceText" placeholder="Enter text to translate..." class="large-input"></textarea>
            </div>

            <div class="section">
                <h3>✨ Translation Result</h3>
                <textarea id="resultText" placeholder="Translation will appear here..." class="large-input" readonly></textarea>
                <button class="btn-copy" onclick="copyResult()">📋 Copy Result</button>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="translateBtn" onclick="doTranslate()">🚀 Translate Now</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ Clear All</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
