<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateSync - AI Translation Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 TranslateSync</h1>
            <p>AI Translation with Smart Reference Learning</p>
        </header>

        <div class="settings-bar">
            <select id="provider" class="control">
                <option value="groq">⚡ Groq</option>
                <option value="openai">🤖 OpenAI</option>
                <option value="cohere">✨ Cohere</option>
                <option value="huggingface">🤗 HuggingFace</option>
            </select>
            <input type="password" id="apiKey" class="control" placeholder="🔑 API Key">
            <select id="language" class="control">
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Japanese">Japanese</option>
                <option value="Chinese (Simplified)">Chinese (Simplified)</option>
                <option value="Traditional Chinese (Hong Kong)">Traditional Chinese (Hong Kong)</option>
                <option value="Korean">Korean</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Russian">Russian</option>
                <option value="Arabic">Arabic</option>
            </select>
        </div>

        <div id="status" class="status"></div>

        <div class="zones">
            <div class="zone" style="border-left: 4px solid #3b82f6;">
                <label>📄 Original Text (A)<small>Source language</small></label>
                <textarea id="zoneA" placeholder="Enter original text..."></textarea>
                <div class="zone-info">
                    <span id="countA">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneA')">📋</button>
                </div>
            </div>

            <div class="zone" style="border-left: 4px solid #8b5cf6;">
                <label>📚 Reference Translation (A')<small>Optional - for style learning</small></label>
                <textarea id="zoneAp" placeholder="Your reference translation..."></textarea>
                <div class="zone-info">
                    <span id="countAp">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneAp')">📋</button>
                </div>
            </div>

            <div class="zone" style="border-left: 4px solid #3b82f6;">
                <label>📝 New Text (B)<small>Text to translate</small></label>
                <textarea id="zoneB" placeholder="Enter new text to translate..."></textarea>
                <div class="zone-info">
                    <span id="countB">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneB')">📋</button>
                </div>
            </div>

            <div class="zone" style="border-left: 4px solid #10b981;">
                <label>✨ AI Translation (B')<small>AI-generated output</small></label>
                <textarea id="zoneBp" placeholder="Translation will appear here..." readonly></textarea>
                <div class="zone-info">
                    <span id="countBp">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneBp')">📋</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="translateBtn" onclick="doTranslate()">🚀 Translate (Ctrl+Enter)</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ Clear All</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
