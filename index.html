<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateSync</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 TranslateSync</h1>
            <p>AI Translation with 12+ Providers</p>
        </header>

        <div class="settings-bar">
            <select id="provider" class="control">
                <option value="">Select Provider</option>
            </select>
            <select id="model" class="control">
                <option value="">Select Model</option>
            </select>
            <input type="password" id="apiKey" class="control" placeholder="API Key" />
            <input type="range" id="temperature" class="control" min="0" max="1" step="0.1" value="0.3" title="Temperature" />
            <select id="language" class="control">
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Japanese">Japanese</option>
                <option value="Chinese (Simplified)">Chinese (Simplified)</option>
                <option value="Korean">Korean</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Russian">Russian</option>
                <option value="Arabic">Arabic</option>
                <option value="Italian">Italian</option>
            </select>
        </div>

        <div class="status" id="status"></div>

        <div class="zones">
            <div class="zone">
                <label>Zone A<br><small>Original</small></label>
                <textarea id="zoneA" placeholder="Enter original text"></textarea>
                <div class="zone-info"><span id="countA">0</span> chars | <button class="btn-mini" onclick="copy('zoneA')">📋</button></div>
            </div>

            <div class="zone">
                <label>Zone A'<br><small>Reference</small></label>
                <textarea id="zoneAp" placeholder="Enter reference translation"></textarea>
                <div class="zone-info"><span id="countAp">0</span> chars | <button class="btn-mini" onclick="copy('zoneAp')">📋</button></div>
            </div>

            <div class="zone">
                <label>Zone B<br><small>New Text</small></label>
                <textarea id="zoneB" placeholder="Enter new text to translate"></textarea>
                <div class="zone-info"><span id="countB">0</span> chars | <button class="btn-mini" onclick="copy('zoneB')">📋</button></div>
            </div>

            <div class="zone">
                <label>Zone B'<br><small>Result</small></label>
                <textarea id="zoneBp" placeholder="AI translation appears here" disabled></textarea>
                <div class="zone-info"><span id="countBp">0</span> chars | <button class="btn-mini" onclick="copy('zoneBp')">📋</button></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="translate()">✨ Translate</button>
            <button class="btn-secondary" onclick="clear()">Clear</button>
            <label><input type="checkbox" id="autoSave" checked /> Auto-save</label>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
