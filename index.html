<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateSync - AI Translation Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 TranslateSync</h1>
            <p style="font-size: 0.9em; color: #999; margin: 5px 0;">AI Translation with Smart Reference Learning</p>
        </header>

        <div class="settings-bar">
            <select id="provider" class="control">
                <option value="deepseek">🔷 DeepSeek</option>
                <option value="groq">⚡ Groq</option>
                <option value="openai">🤖 OpenAI</option>
                <option value="anthropic">🧠 Claude</option>
                <option value="mistral">🎯 Mistral</option>
                <option value="google">🔍 Google</option>
                <option value="cohere">✨ Cohere</option>
                <option value="together">🤝 Together</option>
                <option value="perplexity">🌐 Perplexity</option>
                <option value="aliyun">☁️ Aliyun</option>
                <option value="baidu">🐉 Baidu</option>
                <option value="huggingface">🤗 HuggingFace</option>
                <option value="replicate">🔄 Replicate</option>
                <option value="fireworks">🔥 Fireworks</option>
                <option value="ollama">💻 Ollama</option>
            </select>
            <input type="password" id="apiKey" class="control" placeholder="API Key">
            <select id="language" class="control">
                <option value="Traditional Chinese (Hong Kong)" selected>繁體中文 (香港)</option>
                <option value="Chinese (Simplified)">简体中文</option>
                <option value="Spanish">Español</option>
                <option value="French">Français</option>
                <option value="German">Deutsch</option>
                <option value="Japanese">日本語</option>
                <option value="Korean">한국어</option>
                <option value="Portuguese">Português</option>
                <option value="Russian">Русский</option>
                <option value="Arabic">العربية</option>
            </select>
        </div>

        <div id="status" class="status"></div>

        <div class="zones">
            <div class="zone" style="border-left: 4px solid #3b82f6;">
                <label>📄 Original (A)<small>Source</small></label>
                <textarea id="zoneA" placeholder="Enter original text..."></textarea>
                <div class="zone-info">
                    <span id="countA">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneA')">📋</button>
                </div>
            </div>

            <div class="zone" style="border-left: 4px solid #8b5cf6;">
                <label>📚 Reference (A')<small>Optional</small></label>
                <textarea id="zoneAp" placeholder="Reference translation..."></textarea>
                <div class="zone-info">
                    <span id="countAp">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneAp')">📋</button>
                </div>
            </div>

            <div class="zone" style="border-left: 4px solid #3b82f6;">
                <label>📝 New Text (B)<small>To translate</small></label>
                <textarea id="zoneB" placeholder="Enter text to translate..."></textarea>
                <div class="zone-info">
                    <span id="countB">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneB')">📋</button>
                </div>
            </div>

            <div class="zone" style="border-left: 4px solid #10b981;">
                <label>✨ Translation (B')<small>AI Output</small></label>
                <textarea id="zoneBp" placeholder="Translation will appear here..." readonly></textarea>
                <div class="zone-info">
                    <span id="countBp">0 chars</span>
                    <button class="btn-mini" onclick="copyZone('zoneBp')">📋</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="translateBtn" onclick="doTranslate()">🚀 Translate</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ Clear</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
